<title>Nodeframe Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --plane:#0a0f0d;
    --surface:#111815;
    --surface-2:#17211c;
    --border:rgba(190,215,200,0.12);
    --border-strong:rgba(190,215,200,0.22);
    --ink:#f2efe6;
    --ink-secondary:#a3ad9f;
    --ink-muted:#69746c;
    --copper:#d97a3f;
    --copper-strong:#f0925a;
    --teal:#2bd6a4;
    --good:#35c26b;
    --warning:#f0b429;
    --critical:#e2564e;
    --series-1:#3987e5;
    --series-2:#d97a3f;
    --series-3:#2bd6a4;
    --series-4:#c98500;
    --series-5:#d55181;
    --series-6:#9085e9;
    --series-7:#e66767;
    --series-8:#6da7ec;
    --font-display: Archivo, "Arial Black", sans-serif;
    --font-body: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    --radius-s:6px;
    --radius-m:8px;
    --radius-l:10px;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--plane);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--copper); color:var(--plane); }

  a{ color:var(--teal); }

  .wrap{
    max-width:1440px;
    margin:0 auto;
    padding:0 24px 64px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(10,15,13,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1440px; margin:0 auto;
    padding:14px 24px;
    display:flex; align-items:center; gap:20px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    margin-right:8px;
  }
  .brand-mark{
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-s);
    color:var(--copper);
    flex:none;
  }
  .brand-word{
    font-family:var(--font-display);
    font-weight:900;
    font-size:18px;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  .topbar-divider{
    width:1px; height:24px; background:var(--border-strong);
    flex:none;
  }
  .hub-info{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    color:var(--ink-secondary);
    font-family:var(--font-mono);
    font-size:12px;
  }
  .hub-name{
    font-family:var(--font-body); font-weight:600;
    color:var(--ink); font-size:13px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 8px;
    border:1px solid var(--border-strong);
    border-radius:999px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.02em;
    color:var(--ink-secondary);
    white-space:nowrap;
  }
  .chip b{ color:var(--ink); font-weight:500; }
  .topbar-right{
    margin-left:auto;
    display:flex; align-items:center; gap:14px;
    flex-wrap:wrap;
  }
  .live-clock{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--ink);
    display:flex; align-items:center; gap:8px;
    letter-spacing:0.02em;
  }
  .live-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 3px rgba(43,214,164,0.18);
  }
  .live-dot.animate{ animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.45; transform:scale(0.75); }
  }
  .clock-date{ color:var(--ink-muted); font-size:11px; }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 10px 5px 8px;
    border-radius:999px;
    border:1px solid var(--border-strong);
    font-family:var(--font-mono);
    font-size:11px; font-weight:500;
    letter-spacing:0.04em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .status-pill svg{ flex:none; }
  .status-pill.s-good{ color:var(--good); border-color:rgba(53,194,107,0.35); background:rgba(53,194,107,0.08); }
  .status-pill.s-warning{ color:var(--warning); border-color:rgba(240,180,41,0.35); background:rgba(240,180,41,0.08); }
  .status-pill.s-critical{ color:var(--critical); border-color:rgba(226,86,78,0.4); background:rgba(226,86,78,0.1); }
  .status-pill.s-info{ color:var(--teal); border-color:rgba(43,214,164,0.3); background:rgba(43,214,164,0.07); }

  /* ---------- Sections ---------- */
  section{ margin-top:36px; }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; margin-bottom:14px; flex-wrap:wrap;
  }
  .section-title{
    font-family:var(--font-display);
    font-weight:800;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink);
    display:flex; align-items:center; gap:10px;
  }
  .section-title .num{
    font-family:var(--font-mono); color:var(--ink-muted); font-weight:400;
  }
  .section-sub{
    color:var(--ink-muted);
    font-size:12px;
    font-family:var(--font-mono);
  }

  /* ---------- Stat tiles ---------- */
  .stat-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  .stat-tile{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-l);
    padding:16px 18px;
    display:flex; flex-direction:column; gap:6px;
    min-width:0;
  }
  .stat-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-muted);
    font-family:var(--font-mono);
  }
  .stat-value-row{
    display:flex; align-items:baseline; gap:8px;
    flex-wrap:wrap;
  }
  .stat-value{
    font-family:var(--font-display);
    font-weight:900;
    font-size:32px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .stat-unit{
    font-family:var(--font-mono);
    color:var(--ink-secondary);
    font-size:13px;
  }
  .stat-caption{
    font-size:12px; color:var(--ink-secondary);
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .stat-caption .dot{ width:6px;height:6px;border-radius:50%; display:inline-block; }

  /* ---------- Module grid ---------- */
  .module-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(330px, 1fr));
    gap:14px;
  }
  .module-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-l);
    padding:16px 18px 14px;
    display:flex; flex-direction:column; gap:12px;
    position:relative;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .module-card:hover{ border-color:var(--border-strong); background:var(--surface-2); }
  .module-card-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  .module-id{
    display:flex; align-items:center; gap:8px;
  }
  .slot-badge{
    font-family:var(--font-mono);
    font-size:11px; font-weight:500;
    color:var(--ink);
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    border-radius:4px;
    padding:2px 6px;
    flex:none;
  }
  .module-name{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
  }
  .module-chip{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-muted);
  }
  .module-meta{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .official-tag{
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--ink-muted);
    border:1px solid var(--border); border-radius:3px; padding:1px 4px;
    white-space:nowrap;
  }

  .module-readout{
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  .readout-value{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
    font-weight:500;
    font-size:26px;
    color:var(--ink);
  }
  .readout-unit{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-secondary);
  }
  .readout-secondary{
    margin-left:auto;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-secondary);
    text-align:right;
  }
  .readout-secondary b{
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    font-weight:500;
  }

  .chart-block{ position:relative; }
  .chart-title{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:4px;
  }
  .chart-pair{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .chart-container{
    position:relative;
    width:100%;
    height:108px;
  }
  .chart-container.tall{ height:118px; }
  .chart-svg{
    width:100%; height:100%; display:block;
    touch-action:none;
    cursor:crosshair;
  }
  .chart-svg:focus{ outline:none; }
  .chart-svg:focus-visible{ outline:1px solid var(--teal); outline-offset:2px; }
  .gridline{ stroke:var(--border); stroke-width:1; shape-rendering:crispEdges; }
  .threshold-line{ stroke-width:1; stroke-dasharray:3 3; opacity:0.75; }
  .threshold-label{ font-family:var(--font-mono); font-size:8.5px; opacity:0.95; paint-order:stroke fill; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; }
  .chart-area{ opacity:0.1; stroke:none; }
  .chart-line{ fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .chart-marker{ r:5; stroke:var(--surface); stroke-width:2; }
  .chart-crosshair{ stroke:var(--ink-muted); stroke-width:1; display:none; }
  .chart-hoverdot{ r:4.5; fill:var(--ink); stroke:var(--surface); stroke-width:2; display:none; }
  .chart-hit{ fill:transparent; }
  .chart-tooltip{
    position:absolute;
    pointer-events:none;
    transform:translate(-50%,-115%);
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    border-radius:6px;
    padding:6px 9px;
    font-family:var(--font-mono);
    font-size:11px;
    white-space:nowrap;
    z-index:5;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .tt-value{ color:var(--ink); font-weight:500; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .tt-time{ color:var(--ink-muted); font-size:10px; margin-top:1px; }

  .module-footer{
    display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted);
    padding-top:2px; border-top:1px solid var(--border);
    margin-top:2px;
  }

  /* ---------- Access control scan list ---------- */
  .scan-list{
    display:flex; flex-direction:column;
    max-height:190px; overflow-y:auto;
    border:1px solid var(--border);
    border-radius:var(--radius-s);
  }
  .scan-row{
    display:grid;
    grid-template-columns:56px 1fr auto;
    align-items:center; gap:8px;
    padding:6px 10px;
    border-bottom:1px solid var(--border);
    font-size:12px;
  }
  .scan-row:last-child{ border-bottom:none; }
  .scan-time{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted); }
  .scan-user{ min-width:0; }
  .scan-name{ color:var(--ink); font-weight:500; font-size:12px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scan-uid{ font-family:var(--font-mono); color:var(--ink-muted); font-size:9.5px; display:block; }
  .scan-flag{
    display:inline-flex; align-items:center; gap:4px;
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.04em; text-transform:uppercase;
    padding:2px 6px; border-radius:4px; white-space:nowrap;
  }
  .scan-flag.ok{ color:var(--good); background:rgba(53,194,107,0.1); }
  .scan-flag.denied{ color:var(--critical); background:rgba(226,86,78,0.12); }

  /* ---------- Event log ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-l);
    padding:16px 18px;
  }
  .log-list{
    display:flex; flex-direction:column;
    max-height:420px; overflow-y:auto;
  }
  .log-row{
    display:grid;
    grid-template-columns:20px 84px 130px 1fr;
    gap:12px;
    align-items:start;
    padding:10px 4px;
    border-bottom:1px solid var(--border);
  }
  .log-row:last-child{ border-bottom:none; }
  .log-sev{ margin-top:2px; }
  .log-time{ font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); white-space:nowrap; }
  .log-time .ago{ display:block; color:var(--ink-secondary); font-size:10px; margin-top:1px; }
  .log-module{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .log-module-name{ font-family:var(--font-body); font-weight:600; font-size:12.5px; color:var(--ink); }
  .log-type{ font-family:var(--font-mono); font-size:9px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-muted); }
  .log-msg{ color:var(--ink-secondary); font-size:12.5px; line-height:1.45; }
  .log-row.sev-critical .log-msg{ color:var(--ink); }

  /* ---------- Marketplace ---------- */
  .market-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:12px;
  }
  .market-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:14px 16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .market-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .market-name{ font-family:var(--font-body); font-weight:600; font-size:14px; color:var(--ink); }
  .market-chip{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted); margin-top:2px; }
  .market-badges{ display:flex; gap:6px; flex-wrap:wrap; }
  .badge{
    font-family:var(--font-mono); font-size:9px; letter-spacing:0.05em; text-transform:uppercase;
    padding:2px 6px; border-radius:3px; border:1px solid var(--border-strong); color:var(--ink-secondary);
  }
  .badge.official{ color:var(--copper); border-color:rgba(217,122,63,0.4); background:rgba(217,122,63,0.08); }
  .badge.community{ color:var(--teal); border-color:rgba(43,214,164,0.3); background:rgba(43,214,164,0.06); }
  .market-desc{ color:var(--ink-secondary); font-size:12px; line-height:1.5; flex:1; }
  .market-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .market-meta{ display:flex; flex-direction:column; gap:2px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted); }
  .market-meta b{ color:var(--ink-secondary); font-weight:500; }
  .btn{
    font-family:var(--font-mono);
    font-size:11px; font-weight:500; letter-spacing:0.03em;
    text-transform:uppercase;
    padding:7px 12px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--copper); color:var(--copper-strong); background:rgba(217,122,63,0.08); }
  .btn:focus-visible{ outline:1px solid var(--teal); outline-offset:2px; }
  .btn.installed{
    color:var(--good);
    border-color:rgba(53,194,107,0.35);
    background:rgba(53,194,107,0.08);
    cursor:default;
  }
  .btn.installed:hover{ color:var(--good); background:rgba(53,194,107,0.08); border-color:rgba(53,194,107,0.35); }
  .btn.installed[disabled]{ opacity:1; }

  footer.site-foot{
    margin-top:44px;
    padding-top:18px;
    border-top:1px solid var(--border);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
    font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap;
  }

  @media (max-width:900px){
    .stat-row{ grid-template-columns:repeat(2,1fr); }
    .log-row{ grid-template-columns:16px 1fr; }
    .log-time{ order:3; }
    .log-module{ order:2; }
    .log-msg{ order:4; grid-column:2/3; }
  }
  @media (max-width:560px){
    .stat-row{ grid-template-columns:1fr; }
    .chart-pair{ grid-template-columns:1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="5" r="1.1" fill="currentColor"/><circle cx="11" cy="5" r="1.1" fill="currentColor"/><circle cx="5" cy="11" r="1.1" fill="currentColor"/><circle cx="11" cy="11" r="1.1" fill="currentColor"/></svg>
      </span>
      <span class="brand-word">NODEFRAME</span>
    </div>
    <div class="topbar-divider" aria-hidden="true"></div>
    <div class="hub-info">
      <span class="hub-name" id="hubName">Nodeframe Core Hub</span>
      <span class="chip" id="fwChip">FW <b>v2.4.1</b></span>
      <span class="chip" id="slotsChip">SLOTS <b>8/8</b></span>
    </div>
    <div class="topbar-right">
      <span class="status-pill" id="systemStatusPill"></span>
      <span class="live-clock">
        <span class="live-dot" id="liveDot"></span>
        <span id="clockTime">--:--:--</span>
        <span class="clock-date" id="clockDate"></span>
      </span>
    </div>
  </div>
</div>

<div class="wrap">

  <section id="statsSection" aria-label="System summary">
    <div class="stat-row" id="statRow"></div>
  </section>

  <section aria-labelledby="modulesHeading">
    <div class="section-head">
      <div class="section-title" id="modulesHeading">Modules <span class="num" id="moduleCountLabel"></span></div>
      <div class="section-sub">Slots A1&ndash;A4 &middot; B1&ndash;B3 &middot; C1 &mdash; one shared I2C / analog / digital bus per slot</div>
    </div>
    <div class="module-grid" id="moduleGrid"></div>
  </section>

  <section aria-labelledby="logHeading">
    <div class="section-head">
      <div class="section-title" id="logHeading">Activity Log</div>
      <div class="section-sub" id="logSub"></div>
    </div>
    <div class="panel">
      <div class="log-list" id="logList"></div>
    </div>
  </section>

  <section aria-labelledby="marketHeading">
    <div class="section-head">
      <div class="section-title" id="marketHeading">Plugin Marketplace <span class="num" id="marketCountLabel"></span></div>
      <div class="section-sub">New sensor type = one manifest row, not a firmware rewrite</div>
    </div>
    <div class="market-grid" id="marketGrid"></div>
  </section>

  <footer class="site-foot">
    <span>Nodeframe &middot; MIT licensed</span>
    <span id="footStamp"></span>
  </footer>

</div>

<script>
const SEED = {
  "generated_at": "2026-08-21T09:42:00Z",
  "core": {
    "name": "Nodeframe Core Hub",
    "firmware": "v2.4.1",
    "uptime_hours": 214,
    "slots_total": 8,
    "slots_used": 8
  },
  "modules": [
    {
      "id": "mod-climate-01",
      "slug": "ambient-climate",
      "label": "Ambient Climate",
      "slot": "A1",
      "sensor_chip": "DHT11",
      "metric_key": "temperature",
      "unit": "\u00b0C",
      "secondary_metric_key": "humidity",
      "secondary_unit": "%RH",
      "author": "nodeframe-core",
      "official": true,
      "thresholds": {
        "warn_above": 29,
        "crit_above": 33
      },

    var avg = recent.reduce(function(a,b){return a+b;},0)/recent.length;
    var noise2 = (Math.random()-0.5)*2*cfg.step;
    var reversion = (avg-last)*cfg.reversion;
    var v2 = last + noise2 + reversion;
    if(cfg.min!=null) v2 = Math.max(cfg.min, v2);
    if(cfg.max!=null) v2 = Math.min(cfg.max, v2);
    return round(v2, cfg.decimals);
  }

  /* ============ chart factory ============ */
  function createChart(container, opts){
    // opts: { color, unit, decimals, thresholds:[{value,label,status}], ariaLabel }
    var W = 600, H = opts.height || 180;
    var padL = 8, padR = 8, padT = 12, padB = 12;

    var svg = svgEl('svg');
    svg.setAttribute('viewBox', '0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','none');
    svg.setAttribute('class','chart-svg');
    svg.setAttribute('tabindex','0');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label', opts.ariaLabel || 'Time series chart');

    var gGrid = svgEl('g');
    var gThresh = svgEl('g');
    var areaPath = svgEl('path'); areaPath.setAttribute('class','chart-area');
    var linePath = svgEl('path'); linePath.setAttribute('class','chart-line');
    var marker = svgEl('circle'); marker.setAttribute('class','chart-marker');
    var crosshair = svgEl('line'); crosshair.setAttribute('class','chart-crosshair');
    var hoverDot = svgEl('circle'); hoverDot.setAttribute('class','chart-hoverdot');
    var hitRect = svgEl('rect'); hitRect.setAttribute('class','chart-hit');
    hitRect.setAttribute('x',0); hitRect.setAttribute('y',0);
    hitRect.setAttribute('width',W); hitRect.setAttribute('height',H);

    linePath.style.stroke = opts.color;
    areaPath.style.fill = opts.color;
    marker.style.fill = opts.color;

    svg.appendChild(gGrid);
    svg.appendChild(gThresh);
    svg.appendChild(areaPath);
    svg.appendChild(linePath);
    svg.appendChild(marker);
    svg.appendChild(crosshair);
    svg.appendChild(hoverDot);
    svg.appendChild(hitRect);
    container.appendChild(svg);

    var tooltip = el('div','chart-tooltip');
    tooltip.hidden = true;
    container.appendChild(tooltip);

    var state = { points:[], x:null, y:null };

    function update(points){
      state.points = points;
      var vals = points.map(function(p){ return p.v; });
      var threshVals = (opts.thresholds||[]).map(function(t){ return t.value; });
      var min = Math.min.apply(null, vals.concat(threshVals));
      var max = Math.max.apply(null, vals.concat(threshVals));
      if(min===max){ min -= 1; max += 1; }
      var range = max-min;
      min -= range*0.10; max += range*0.14;

      function x(i){ return padL + (points.length<=1?0:(i/(points.length-1))*(W-padL-padR)); }
      function y(v){ return padT + (1 - (v-min)/(max-min))*(H-padT-padB); }
      state.x = x; state.y = y; state.W = W; state.H = H; state.padL=padL; state.padR=padR;

      gGrid.innerHTML = '';
      [0.25,0.5,0.75].forEach(function(f){
        var ly = padT + f*(H-padT-padB);
        var line = svgEl('line');
        line.setAttribute('x1',padL); line.setAttribute('x2',W-padR);
        line.setAttribute('y1',ly); line.setAttribute('y2',ly);
        line.setAttribute('class','gridline');
        gGrid.appendChild(line);
      });

      gThresh.innerHTML = '';
      (opts.thresholds||[]).forEach(function(t){
        var ty = y(t.value);
        var line = svgEl('line');
        line.setAttribute('x1',padL); line.setAttribute('x2',W-padR);
        line.setAttribute('y1',ty); line.setAttribute('y2',ty);
        line.setAttribute('class','threshold-line');
        line.style.stroke = cssVar('--'+t.status);
        gThresh.appendChild(line);
        var label = svgEl('text');
        label.setAttribute('x', W-padR); label.setAttribute('y', ty-3.5);
        label.setAttribute('text-anchor','end');
        label.setAttribute('class','threshold-label');
        label.style.fill = cssVar('--'+t.status);
        label.textContent = t.label;
        gThresh.appendChild(label);
      });

      var d = '', ad = '';
      points.forEach(function(p,i){
        var px = x(i).toFixed(2), py = y(p.v).toFixed(2);
        d += (i===0?'M':'L')+px+','+py+' ';
      });
      var baseY = (H-padB).toFixed(2);
      ad = d + 'L'+x(points.length-1).toFixed(2)+','+baseY+' L'+x(0).toFixed(2)+','+baseY+' Z';
      linePath.setAttribute('d', d);
      areaPath.setAttribute('d', ad);

      var last = points[points.length-1];
      marker.setAttribute('cx', x(points.length-1));
      marker.setAttribute('cy', y(last.v));
    }

    function showAt(idx){
      var pts = state.points;
      if(!pts.length) return;
      idx = Math.max(0, Math.min(pts.length-1, idx));
      var p = pts[idx];
      var px = state.x(idx), py = state.y(p.v);
      crosshair.setAttribute('x1', px); crosshair.setAttribute('x2', px);
      crosshair.setAttribute('y1', 6); crosshair.setAttribute('y2', state.H-6);
      crosshair.style.display = 'block';
      hoverDot.setAttribute('cx', px); hoverDot.setAttribute('cy', py);
      hoverDot.style.display = 'block';
      tooltip.hidden = false;
      var pctX = px / state.W * 100;
      var pctY = py / state.H * 100;
      tooltip.style.left = pctX+'%';
      tooltip.style.top = pctY+'%';
      tooltip.innerHTML = '';
      var vEl = el('div','tt-value');
      vEl.textContent = fmtNum(p.v, opts.decimals) + ' ' + opts.unit;
      var tEl = el('div','tt-time');
      tEl.textContent = fmtClockShort(p.t) + ' UTC';
      tooltip.appendChild(vEl); tooltip.appendChild(tEl);
    }
    function hide(){
      tooltip.hidden = true;
      crosshair.style.display = 'none';
      hoverDot.style.display = 'none';
    }
    function idxFromEvent(evt){
      var rect = svg.getBoundingClientRect();
      var relX = (evt.clientX - rect.left) / rect.width * state.W;
      var frac = (relX - padL) / (state.W - padL - padR);
      return Math.round(frac * (state.points.length-1));
    }
    svg.addEventListener('pointermove', function(evt){ showAt(idxFromEvent(evt)); });
    svg.addEventListener('pointerleave', hide);
    svg.addEventListener('focus', function(){ showAt(state.points.length-1); });
    svg.addEventListener('blur', hide);
    var focusIdx = 0;
    svg.addEventListener('keydown', function(evt){
      if(evt.key==='ArrowLeft'){ focusIdx = Math.max(0, (focusIdx||state.points.length-1)-1); showAt(focusIdx); evt.preventDefault(); }
      else if(evt.key==='ArrowRight'){ focusIdx = Math.min(state.points.length-1, (focusIdx||0)+1); showAt(focusIdx); evt.preventDefault(); }
    });

    return { update: update };
  }

  /* ============ module card rendering ============ */
  var METRIC_LABEL = {
    'ambient-climate':'TEMP', 'gas-level':'GAS PPM', 'proximity':'DISTANCE',
    'ambient-light':'LUX', 'vibration':'VIBRATION', 'air-quality':'CO₂', 'soil-moisture':'SOIL MOISTURE'
  };

  function thresholdsFor(m){
    var t = m.def.thresholds;
    if(!t) return [];
    var arr = [];
    if(t.warn_above!=null) arr.push({ value:t.warn_above, label:'WARN '+t.warn_above, status:'warning' });
    if(t.crit_above!=null) arr.push({ value:t.crit_above, label:'CRIT '+t.crit_above, status:'critical' });
    if(t.warn_below!=null) arr.push({ value:t.warn_below, label:'WARN '+t.warn_below, status:'warning' });
    if(t.crit_below!=null) arr.push({ value:t.crit_below, label:'CRIT '+t.crit_below, status:'critical' });
    return arr;
  }

      pair.appendChild(c1); pair.appendChild(c2);
      chartBlock.appendChild(pair);

      m.chartApi = createChart(cc1, { color:color, unit:'°C', decimals:2, thresholds:thresholdsFor(m), ariaLabel: d.label+' temperature over time' }); // climate thresholds are close to the live range, worth showing
      m.chartApi2 = createChart(cc2, { color:color, unit:'%RH', decimals:1, thresholds:[], ariaLabel: d.label+' humidity over time' });
      m.chartApi.update(m.series.map(function(p){ return {t:p.t, v:p.v}; }));

      m.chartApi = createChart(cc, { color:color, unit:d.unit, decimals:decimalsFor(m.slug), thresholds: showThresh ? thresholdsFor(m) : [], ariaLabel: d.label+' over time' });

    return card;

  function decimalsFor(slug){
    if(slug==='ambient-climate') return 2;
    if(slug==='vibration') return 2;
    if(slug==='soil-moisture') return 1;
    if(slug==='proximity') return 1;
    if(slug==='ambient-light') return 0;
    return 1;
  }

  function agoDays(iso){
    var ms = virtualNow().getTime() - new Date(iso).getTime();
    var days = Math.floor(ms/86400000);
    if(days < 1) return 'today';
    return days+'d ago';
  }

  /* ============ stat tiles ============ */
  function computeAvgSampleRate(){
    var rates = [];
    modules.forEach(function(m){
      if(!m.series || m.series.length < 2) return;
      var a = new Date(m.series[m.series.length-2].t).getTime();
      var b = new Date(m.series[m.series.length-1].t).getTime();
      var deltaMin = (b-a)/60000;
      if(deltaMin > 0) rates.push(1/deltaMin); // samples per minute
    });
    if(!rates.length) return 0;
    return rates.reduce(function(a,b){return a+b;},0)/rates.length;
  }

  function currentAlertBreakdown(){
    var warn = 0, crit = 0;
    modules.forEach(function(m){
      if(m.status==='warning') warn++;
      else if(m.status==='critical') crit++;
    });
    return { warn:warn, crit:crit, total:warn+crit };
  }

  function overallStatus(){
    var worst = 'good';
    modules.forEach(function(m){
      if(STATUS_RANK[m.status] > STATUS_RANK[worst]) worst = m.status;
    });
    return worst;
  }

  var statTileRefs = {};
  function buildStatTiles(){
    var row = byId('statRow');
    row.innerHTML = '';

    var activeCount = modules.length;
    var t1 = statTile('Active modules', activeCount+'', '/ '+SEED.core.slots_total, iconHtml('modules'));
    row.appendChild(t1.node);

    var alerts = currentAlertBreakdown();
    var t2 = statTile('Open alerts', alerts.total+'', 'in current view', iconHtml('alert'));
    row.appendChild(t2.node);
    statTileRefs.alerts = t2;

    var rate = computeAvgSampleRate();
    var perHour = Math.round(rate*60);
    var t3 = statTile('Avg sample rate', perHour+'', '/hr per module', iconHtml('pulse'));
    row.appendChild(t3.node);

    var uh = SEED.core.uptime_hours;
    var days = Math.floor(uh/24), hrs = Math.round(uh%24);
    var t4 = statTile('Core uptime', days+'d '+hrs+'h', 'since last reboot', iconHtml('clock'));
    t4.node.id = 'uptimeTile';
    row.appendChild(t4.node);
    statTileRefs.uptime = t4;

    refreshAlertTile();
  }

  function statTile(label, value, caption, icon){
    var node = el('div','stat-tile');
    var top = el('div');
    top.style.display='flex'; top.style.justifyContent='space-between'; top.style.alignItems='flex-start';
    var lab = el('div','stat-label'); lab.textContent = label;

    vrow.appendChild(val);
    var cap = el('div','stat-caption');
    var capText = document.createElement('span'); capText.textContent = caption;
    cap.appendChild(capText);
    node.appendChild(top); node.appendChild(vrow); node.appendChild(cap);
    return { node:node, valueEl:val, captionEl:cap };
  }

  function refreshAlertTile(){
    var alerts = currentAlertBreakdown();
    statTileRefs.alerts.valueEl.textContent = alerts.total;
    var cap = statTileRefs.alerts.captionEl;
    cap.innerHTML = '';
    if(alerts.warn){
      var d1 = el('span','dot'); d1.style.background='var(--warning)';
      cap.appendChild(d1);
      var s1 = document.createElement('span'); s1.textContent = alerts.warn+' warning';
      cap.appendChild(s1);

    if(alerts.crit){
      var d2 = el('span','dot'); d2.style.background='var(--critical)';
      cap.appendChild(d2);
      var s2 = document.createElement('span'); s2.textContent = alerts.crit+' critical';
      cap.appendChild(s2);
    }

      var s3 = document.createElement('span'); s3.textContent = 'all modules nominal';
      cap.appendChild(s3);

  /* ============ event log ============ */
  function buildMergedLog(){
    var items = SEED.events.map(function(e){
      return { t:e.t, severity:e.severity, module:e.module, message:e.message, type:e.type };
    });
    SEED.modules.forEach(function(m){
      if(!m.scans) return;
      m.scans.forEach(function(s){
        items.push({
          t: s.t,
          severity: s.authorized ? 'info' : 'warning',
          module: 'Access Control',
          type: 'access',
          message: (s.authorized ? 'Badge '+s.card_uid+' ('+s.user_name+') granted access.' : 'Unrecognized badge '+s.card_uid+' presented — access denied.')
        });
      });
    });
    items.sort(function(a,b){ return new Date(b.t) - new Date(a.t); });
    return items;
  }

  function refreshLogTimes(){

          module: p.name,
          type: 'plugin',
          message: "Plugin '"+p.slug+"' v"+p.version+' installed from '+p.author+' — awaiting slot assignment.'
        });
      });
    }
    foot.appendChild(meta);
    foot.appendChild(btn);
    card.appendChild(foot);
    return card;
  }

  /* ============ live simulation ============ */
  function tickModuleData(){
    modules.forEach(function(m){
      if(m.slug === 'access-control') return;
      var cfg = SIM_CFG[m.slug];
      if(!cfg) return;
      var vals = m.series.map(function(p){ return p.v; });
      var nextV = nextValue(vals, cfg);
      var lastT = new Date(m.series[m.series.length-1].t);
      var nextT = new Date(lastT.getTime() + 2*60000);
      var point = { t: nextT.toISOString(), v: nextV };
      if(cfg.v2){
        var vals2 = m.series.map(function(p){ return p.v2; });
        point.v2 = nextValue(vals2, cfg.v2);
      }
      m.series.push(point);
      if(m.series.length > 90) m.series.shift();
      m.latest = nextV;
      m.status = computeStatus(nextV, m.def.thresholds);

      var rv = byId('val-'+m.slug);
      if(rv) rv.textContent = fmtNum(nextV, decimalsFor(m.slug));
      if(point.v2!=null){
        var rv2 = byId('val2-'+m.slug);
        if(rv2) rv2.innerHTML = '<b>'+fmtNum(point.v2,1)+'</b> '+m.def.secondary_unit;
      }
      var pillHost = byId('pill-'+m.slug);
      if(pillHost){
        var np = statusPill(m.status);
        pillHost.replaceWith(np);
        np.id = 'pill-'+m.slug;
      }

      if(m.chartApi) m.chartApi.update(m.series.map(function(p){ return {t:p.t, v:p.v}; }));
      if(m.chartApi2) m.chartApi2.update(m.series.map(function(p){ return {t:p.t, v:p.v2}; }));
    });
    refreshAlertTile();
    refreshTopBar();
  }

  /* ============ boot ============ */
  function boot(){
    byId('hubName').textContent = SEED.core.name;
    byId('fwChip').innerHTML = 'FW <b>'+SEED.core.firmware+'</b>';
    byId('slotsChip').innerHTML = 'SLOTS <b>'+SEED.core.slots_used+'/'+SEED.core.slots_total+'</b>';
    byId('moduleCountLabel').textContent = '('+modules.length+')';
    byId('footStamp').textContent = 'snapshot '+SEED.generated_at;

    buildStatTiles();

    var grid = byId('moduleGrid');
    modules.forEach(function(m){ grid.appendChild(buildModuleCard(m)); });

    renderLog();
    buildMarketGrid();
    refreshTopBar();
    refreshUptimeTile();

    if(!reduceMotion){
      byId('liveDot').classList.add('animate');
      setInterval(function(){
        refreshTopBar();
        refreshUptimeTile();
        refreshLogTimes();
      }, 1000);
      setInterval(tickModuleData, 3600);
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
